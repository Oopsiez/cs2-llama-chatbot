[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2bot"
version = "1.1.0"
description = "Local-LLM chatbot that reads Counter-Strike 2 chat and replies in-game, with a web control panel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.2.79"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
cs2bot = "cs2bot.__main__:main"

[tool.setuptools.packages.find]
include = ["cs2bot*"]

[tool.setuptools.package-data]
cs2bot = ["web/static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
