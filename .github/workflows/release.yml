name: Release

# Tag a version (`git tag v0.1.0 && git push --tags`) and this attaches a ready-to-run
# `CS2 Chatbot.exe` to the GitHub release, so users download one file and double-click it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: python scripts/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: cs2-chatbot-windows
          path: dist/CS2 Chatbot.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/CS2 Chatbot.exe
